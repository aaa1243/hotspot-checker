name: Build EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1 is what the exe runs on, so check the syntax with it.
      - name: Check script for syntax errors (PowerShell 5.1)
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\HotspotChecker.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; throw "Syntax errors found" }
          Write-Host "No syntax errors"

      - name: Install ps2exe
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force

      - name: Build EXE
        shell: pwsh
        run: |
          Invoke-ps2exe -inputFile .\HotspotChecker.ps1 `
            -outputFile .\HotspotChecker.exe `
            -noConsole `
            -requireAdmin `
            -STA `
            -title "Hotspot Checker" `
            -product "Hotspot Checker" `
            -version "1.0.0"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HotspotChecker
          path: HotspotChecker.exe

      - name: Publish release (only on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HotspotChecker.exe
            hotspot-checker-mac.sh

  # Separate job, so a failure here shows red but does not block the exe.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logic test with fake network setups
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\logic.ps1
      - name: Real scan on this machine
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\selftest.ps1

  # Mac version. /bin/bash on macOS is the old 3.2, which is what players have.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logic test with fake network setups
        run: /bin/bash tests/logic-mac.sh
      - name: Real scan on this machine
        run: /bin/bash tests/selftest-mac.sh
